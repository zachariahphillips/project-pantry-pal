{# Phase 12C.2: applies only to this request. Phase 12C.3 may later
   preselect these choices from household settings. #}
<fieldset class="flex items-center justify-between gap-3 rounded-xl border border-stone-200 bg-stone-50 px-3 py-2"
          data-meal-plan-dietary-preferences>
  <legend class="text-xs font-medium text-stone-700">Dietary</legend>
  <div class="flex flex-wrap justify-end gap-1.5">
    <label class="cursor-pointer">
      <input type="checkbox"
             name="dietary_preferences"
             value="vegetarian"
             class="peer sr-only">
      <span class="inline-flex h-8 items-center rounded-lg border border-stone-300 bg-white px-2.5 text-xs font-medium text-stone-600 transition hover:border-green-500 hover:text-green-800 peer-focus-visible:ring-2 peer-focus-visible:ring-green-300 peer-checked:border-green-600 peer-checked:bg-green-100 peer-checked:text-green-900">
        Vegetarian
      </span>
    </label>
    <label class="cursor-pointer">
      <input type="checkbox"
             name="dietary_preferences"
             value="gluten_free"
             class="peer sr-only">
      <span class="inline-flex h-8 items-center rounded-lg border border-stone-300 bg-white px-2.5 text-xs font-medium text-stone-600 transition hover:border-green-500 hover:text-green-800 peer-focus-visible:ring-2 peer-focus-visible:ring-green-300 peer-checked:border-green-600 peer-checked:bg-green-100 peer-checked:text-green-900">
        Gluten-free
      </span>
    </label>
  </div>
</fieldset>
