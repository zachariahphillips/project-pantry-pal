{# Phase 14A.1: renders in a card header and as an OOB update after a
   confirmed deduction or its Undo, so the shared status never goes stale. #}
<div id="meal-plan-cooked-status-{{ plan.id }}"
     {% if swap_oob|default(false) %}hx-swap-oob="outerHTML"{% endif %}
     class="{% if plan.cooked_status_label %}mt-1{% endif %}">
  {% if plan.cooked_status_label %}
    <span data-meal-plan-cooked-status
          class="inline-flex items-center gap-1 rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-semibold text-emerald-800">
      <svg viewBox="0 0 20 20" class="h-3.5 w-3.5" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="m5.5 10 2.7 2.7 6.3-6.3"/>
      </svg>
      <time datetime="{{ plan.cooked_at.isoformat() }}"
            title="Cooked {{ plan.cooked_at.strftime('%b %-d, %Y at %-I:%M %p UTC') }}">
        {{ plan.cooked_status_label }}
      </time>
    </span>
  {% endif %}
</div>
