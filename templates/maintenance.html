<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>PantryPal is down for maintenance</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900">
  <main class="mx-auto flex min-h-screen max-w-lg items-center px-6 py-12">
    <section class="w-full rounded-3xl border border-stone-200 bg-white p-6 text-center shadow-sm">
      <p class="text-sm font-semibold uppercase tracking-wide text-green-700">
        PantryPal
      </p>
      <p class="mx-auto mt-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-green-50 text-2xl" aria-hidden="true">
        PP
      </p>
      <h1 class="mt-3 text-2xl font-bold text-stone-950">
        PantryPal is down for maintenance
      </h1>
      <p class="mt-3 text-sm leading-6 text-stone-600">
        {{ maintenance_message }}
      </p>
      <p class="mt-4 rounded-2xl bg-stone-50 px-4 py-3 text-xs font-medium text-stone-500">
        Your pantry data is safe. Try refreshing this page in about five minutes.
      </p>
    </section>
  </main>
</body>
</html>
