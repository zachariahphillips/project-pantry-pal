name: Backup SQLite

on:
  workflow_dispatch:
  schedule:
    # 10:23 UTC keeps it away from common top-of-hour service spikes.
    - cron: "23 10 * * *"

jobs:
  backup:
    name: Create Fly SQLite backup
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      FLY_APP_NAME: pantrypal-riah

    steps:
      # Needed so the verify step can run the repo's own backup helper.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create timestamped backup on Fly volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$FLY_API_TOKEN" ]; then
            echo "Set the FLY_API_TOKEN repository secret before running backups."
            exit 1
          fi

          fly ssh console --app "$FLY_APP_NAME" \
            -C "python /app/scripts/backup_sqlite.py --verify --emit-base64 --keep 14" \
            > backup-output.txt

          awk '
            /^BEGIN_PANTRYPAL_SQLITE_BACKUP_BASE64$/ { capture = 1; next }
            /^END_PANTRYPAL_SQLITE_BACKUP_BASE64$/ { capture = 0 }
            capture { print }
          ' backup-output.txt | base64 --decode > pantrypal-backup.sqlite3

          test -s pantrypal-backup.sqlite3
          rm backup-output.txt

      # `test -s` above only proves the decode produced bytes. This proves the
      # bytes are a restorable database, before it becomes a restore point.
      - name: Verify decoded backup
        run: python3 scripts/backup_sqlite.py --verify-file pantrypal-backup.sqlite3

      - name: Upload SQLite backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: pantrypal-sqlite-backup-${{ github.run_id }}
          path: pantrypal-backup.sqlite3
          if-no-files-found: error
          retention-days: 14
